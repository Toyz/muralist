[package]
name = "muralist"
version = "0.1.0"
edition = "2024"
description = "A Wallhaven wallpaper manager for multi-monitor Linux desktops, built with GPUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Toyz/muralist"
readme = "README.md"
keywords = ["wallpaper", "wallhaven", "gpui", "kde", "desktop"]
categories = ["gui"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
dirs = "7.0.0"
futures = "0.3"
gpui-kit = "0.7"
image = "0.25.10"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus, for the KDE Plasma backend.
zbus = "5"

# GPUI is very slow unoptimized; optimize dependencies even in dev builds so
# scrolling stays smooth while keeping our own crate quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

